name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/sidecar-images.tar
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,mode=max,scope=test-image
      - name: Load smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sidecar-smoke:local
          cache-from: type=gha,scope=test-image
      - name: Smoke test environment and file tokens
        shell: bash
        run: |
          mkdir -p /tmp/sidecar-config
          cp config.example.yaml /tmp/sidecar-config/config.yaml
          printf 'smoke-token\n' > /tmp/sidecar-config/abs_token
          for source in env file; do
            token_args=(-e ABS_TOKEN=smoke-token)
            if [[ "$source" == file ]]; then
              token_args=(-e ABS_TOKEN_FILE=/run/secrets/abs_token)
            fi
            docker run --name sidecar-smoke -d -p 127.0.0.1:8082:8082 \
              --mount type=bind,src=/tmp/sidecar-config/config.yaml,dst=/app/config.yaml,readonly \
              --mount type=bind,src=/tmp/sidecar-config/abs_token,dst=/run/secrets/abs_token,readonly \
              -e ABS_URL=http://127.0.0.1:9 "${token_args[@]}" sidecar-smoke:local
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent --show-error --max-time 2 \
                --output /tmp/sidecar-health.json http://127.0.0.1:8082/healthz; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              echo '::error::Container did not become healthy within 30 attempts.'
              exit 1
            fi
            python -c 'import json; assert json.load(open("/tmp/sidecar-health.json")) == {"status": "ok"}'
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8082/audiobookshelf/playlists)" = 401
            docker exec sidecar-smoke ffmpeg -version
            docker exec sidecar-smoke ffprobe -version
            docker rm -f sidecar-smoke
          done
      - name: Container logs
        if: failure()
        run: docker logs sidecar-smoke || true
      - name: Clean up
        if: always()
        run: docker rm -f sidecar-smoke || true
