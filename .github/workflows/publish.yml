name: Publish container image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must be stable semantic versions such as 0.1.1 (without a v prefix)."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit must belong to main."
            exit 1
          fi
          printf 'version=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: testdata/socketio/package-lock.json

      - name: Install the Socket.IO compatibility test server
        run: npm ci --prefix testdata/socketio --ignore-scripts --no-audit --no-fund

      - name: Install FFmpeg for audio integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test the release
        run: |
          go vet ./...
          SIDECAR_SOCKETIO_TEST=1 go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
